name: pickmaster

services:
  api:
    build: ./backend
    container_name: pickmaster_api
    restart: unless-stopped
    env_file: .env
    environment:
      # la URL completa viene del .env (con contraseña); no se interpola aquí
      PICKMASTER_MC_SIMS: "10000"
    networks:
      apps-net:
        # alias ÚNICO: 'api' en apps-net pertenece a otro proyecto (ops-api)
        aliases: [pickmaster-api]
    ports:
      - "127.0.0.1:8088:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: ./backend
    container_name: pickmaster_worker
    restart: unless-stopped
    env_file: .env
    environment:
      PICKMASTER_MC_SIMS: "10000"
      # ESPN público (Liga MX sin key) en scheduler: agenda T-24h + stats post-partido
      PICKMASTER_ESPN_SCHEDULE: "1"
    networks: [apps-net]
    # Fase 3: T-24h / T-6h / T-1h, evaluación post-partido y notificaciones.
    command: python -m app.worker.cli run-scheduler

  web:
    build: ./frontend
    container_name: pickmaster_web
    restart: unless-stopped
    environment:
      # el SSR del SvelteKit consume la API interna (alias único de compose)
      PUBLIC_API_URL: http://pickmaster-api:8000
    networks: [apps-net]
    ports:
      - "127.0.0.1:8087:3000"

  redis:
    image: redis:7-alpine
    container_name: pickmaster_redis
    restart: unless-stopped
    networks: [apps-net]

networks:
  apps-net:
    external: true
